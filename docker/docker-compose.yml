version: '3.8'

services:
  colorflow-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      # 缺失时 docker compose 直接报错，避免注入弱默认 key
      - COLORFLOW_API_KEY=${COLORFLOW_API_KEY:?请通过环境变量设置 COLORFLOW_API_KEY}
      - COLORFLOW_OUTPUT_DIR=/data/output
    volumes:
      - ../data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  colorflow-cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/data
    command: --input /data/input.png --output /data/output.svg --mode color
